name: Verifier les scripts R
on:
  push:
    paths:
      - 'tp/**'
      - 'enseignant/verifier_corriges.R'
      - 'installation.R'
      - '.github/workflows/verifier-r.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-r-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tibble
            any::tidyr
            any::forcats
            any::stringr
            any::labelled
            any::haven
            any::gtsummary
            any::gt
            any::broom
          dependencies: '"hard"'
          cache: always
          install-quarto: false
      - name: Executer les enonces et corriges
        run: Rscript enseignant/verifier_corriges.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-r
          path: resultats/
          retention-days: 14
